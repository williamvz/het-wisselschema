<style>/* ------------------------------------------------------------------ tokens */
:root {
  --bg: #f1f4f2;
  --vlak: #ffffff;
  --vlak-2: #f7f9f8;
  --rand: #dde4e0;
  --tekst: #0f1714;
  --zacht: #5b6b63;
  --accent: #10794a;
  --accent-fel: #15a163;
  --accent-zacht: #e3f3ea;
  --waarschuwing: #b45309;
  --waarschuwing-zacht: #fef3c7;
  --alarm: #be123c;
  --alarm-zacht: #ffe4e9;
  --rol-K: #d97706;
  --rol-V: #2563eb;
  --rol-M: #7c3aed;
  --rol-A: #e11d48;
  --bank: #94a3b8;
  --schaduw: 0 1px 2px rgba(12, 30, 22, .06), 0 6px 20px rgba(12, 30, 22, .07);
  --r: 16px;
  --r-s: 10px;
  --veld-1: #2f9e5e;
  --veld-2: #2a8d54;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-thema="licht"]) {
    --bg: #0c1310; --vlak: #151e19; --vlak-2: #1b2620; --rand: #2a3830;
    --tekst: #e9f1ec; --zacht: #94a89d;
    --accent: #2fbd74; --accent-fel: #3ad484; --accent-zacht: #16301f;
    --waarschuwing: #fbbf24; --waarschuwing-zacht: #34240a;
    --alarm: #fb7185; --alarm-zacht: #3b0d18;
    --rol-K: #f0a532; --rol-V: #5b91f5; --rol-M: #a17cf0; --rol-A: #f4506f;
    --bank: #64748b;
    --schaduw: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
    --veld-1: #1f6b41; --veld-2: #1b5d39;
  }
}
:root[data-thema="donker"] {
  --bg: #0c1310; --vlak: #151e19; --vlak-2: #1b2620; --rand: #2a3830;
  --tekst: #e9f1ec; --zacht: #94a89d;
  --accent: #2fbd74; --accent-fel: #3ad484; --accent-zacht: #16301f;
  --waarschuwing: #fbbf24; --waarschuwing-zacht: #34240a;
  --alarm: #fb7185; --alarm-zacht: #3b0d18;
  --rol-K: #f0a532; --rol-V: #5b91f5; --rol-M: #a17cf0; --rol-A: #f4506f;
  --bank: #64748b;
  --schaduw: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
  --veld-1: #1f6b41; --veld-2: #1b5d39;
}

/* ------------------------------------------------------------------ basis */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--tekst);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: contain;
}
h1, h2, h3 { margin: 0; line-height: 1.2; letter-spacing: -.02em; }
h1 { font-size: 1.35rem; font-weight: 700; }
h2 { font-size: 1.1rem; font-weight: 700; }
h3 { font-size: .95rem; font-weight: 650; }
p { margin: 0 0 .6em; }
button { font: inherit; color: inherit; }
input, select, textarea { font: inherit; color: inherit; }

#app { max-width: 720px; margin: 0 auto; padding: 0 16px 100px; }

/* ------------------------------------------------------------------ header */
.kop {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 0 10px; margin-bottom: 4px;
  background: linear-gradient(var(--bg) 72%, transparent);
}
.kop .titel { flex: 1; min-width: 0; }
.kop .titel small { display: block; color: var(--zacht); font-size: .78rem; font-weight: 500; }
.kop .titel strong { display: block; font-size: 1.15rem; font-weight: 700; letter-spacing: -.02em;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.merk { width: 34px; height: 34px; border-radius: 10px; flex: none;
  background: linear-gradient(140deg, var(--accent-fel), var(--accent));
  display: grid; place-items: center; color: #fff; font-weight: 800; font-size: .9rem; }

/* ------------------------------------------------------------------ account */
.teamknop { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; border-radius: 8px; }
.teamknop strong::after { content: ' ▾'; font-size: .7em; color: var(--zacht); }
.teamknop:focus-visible { outline: 2px solid var(--accent-fel); outline-offset: 2px; }
.aanwezig { display: flex; padding-left: 6px; flex: none; }
.aanwezig span { width: 28px; height: 28px; margin-left: -6px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent-zacht); color: var(--accent); border: 2px solid var(--bg); font-size: .66rem; font-weight: 800; }
.accountknop { position: relative; width: 38px; height: 38px; flex: none; border-radius: 50%; cursor: pointer;
  border: 1px solid var(--rand); background: var(--vlak); font-weight: 750; font-size: .78rem; color: var(--tekst); }
.stip { position: absolute; right: -2px; bottom: -2px; width: 13px; height: 13px; border-radius: 50%;
  border: 2px solid var(--bg); background: var(--bank); }
.stip.los { position: static; display: inline-block; flex: none; border-color: var(--vlak); }
.stip.ok { background: var(--accent-fel); }
.stip.bezig { background: var(--waarschuwing); }
.stip.fout { background: var(--alarm); }
.balk-melding { align-items: center; }
.balk-melding .knop { flex: none; }

.inlog { max-width: 420px; margin: 0 auto; padding: max(6vh, 24px) 0 40px; }
.inlog > .merk { width: 56px; height: 56px; border-radius: 16px; font-size: 1.4rem; margin: 0 auto 12px; }
.inlog > h1 { text-align: center; margin-bottom: 6px; }
.inlog > .uitleg { text-align: center; margin: 0 8px 18px; }
.inlog label.veld small { display: block; margin-top: 5px; line-height: 1.35; }
.fout { color: var(--alarm); font-size: .86rem; font-weight: 600; margin: 0 0 10px; }
.fout:empty { display: none; }
.centraal { text-align: center; }

/* ------------------------------------------------------------------ kaarten */
.kaart {
  background: var(--vlak); border: 1px solid var(--rand); border-radius: var(--r);
  padding: 14px; margin-bottom: 12px; box-shadow: var(--schaduw);
}
.kaart > h2, .kaart > h3 { margin-bottom: 10px; }
.kaart-kop { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.kaart-kop h2, .kaart-kop h3 { flex: 1; margin: 0; }
.uitleg { color: var(--zacht); font-size: .84rem; margin: -4px 0 10px; }
.leeg { color: var(--zacht); text-align: center; padding: 26px 12px; font-size: .9rem; }

/* ------------------------------------------------------------------ knoppen */
.knop {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 46px; padding: 0 16px; border-radius: 12px;
  border: 1px solid var(--rand); background: var(--vlak); color: var(--tekst);
  font-weight: 600; font-size: .95rem; cursor: pointer;
  transition: transform .06s ease, background .12s ease, border-color .12s ease;
}
.knop:active { transform: scale(.975); }
.knop:disabled { opacity: .45; cursor: default; }
.knop.primair { background: var(--accent); border-color: var(--accent); color: #fff; }
.knop.gevaar { background: var(--alarm-zacht); border-color: transparent; color: var(--alarm); }
.knop.stil { background: transparent; border-color: transparent; color: var(--zacht); }
.knop.breed { width: 100%; }
.knop.groot { min-height: 58px; font-size: 1.05rem; border-radius: 14px; }
.knop.klein { min-height: 36px; padding: 0 11px; font-size: .84rem; border-radius: 9px; }
.knoprij { display: flex; gap: 8px; flex-wrap: wrap; }
.knoprij > .knop { flex: 1 1 auto; }

/* ------------------------------------------------------------------ velden */
label.veld { display: block; margin-bottom: 12px; }
label.veld > span { display: block; font-size: .8rem; font-weight: 600; color: var(--zacht); margin-bottom: 5px; }
input[type=text], input[type=password], input[type=date], input[type=number], select, textarea {
  width: 100%; min-height: 46px; padding: 10px 12px;
  background: var(--vlak-2); border: 1px solid var(--rand); border-radius: 11px;
}
textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus, .knop:focus-visible, .chip:focus-visible {
  outline: 2px solid var(--accent-fel); outline-offset: 1px;
}
.rij2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rij3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

/* keuzeknoppen (segmented) */
.segment { display: flex; gap: 4px; background: var(--vlak-2); border: 1px solid var(--rand);
  border-radius: 12px; padding: 4px; }
.segment button { flex: 1; min-height: 38px; border: 0; border-radius: 9px; background: transparent;
  font-weight: 600; font-size: .88rem; cursor: pointer; color: var(--zacht); }
.segment button[aria-pressed="true"] { background: var(--vlak); color: var(--tekst); box-shadow: var(--schaduw); }

/* ------------------------------------------------------------------ chips */
.chip {
  display: inline-flex; align-items: center; gap: 7px; min-height: 42px;
  padding: 0 13px; border-radius: 11px; cursor: pointer;
  background: var(--vlak-2); border: 1px solid var(--rand);
  font-weight: 600; font-size: .9rem; user-select: none;
}
.chip[aria-pressed="true"] { background: var(--accent-zacht); border-color: var(--accent); color: var(--accent); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bank); flex: none; }
.chip[aria-pressed="true"] .dot { background: var(--accent); }
.chiprij { display: flex; flex-wrap: wrap; gap: 8px; }

.vlag { display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: .68rem;
  font-weight: 700; letter-spacing: .03em; background: var(--vlak-2); color: var(--zacht); border: 1px solid var(--rand); }
.vlag.K { background: color-mix(in srgb, var(--rol-K) 16%, transparent); color: var(--rol-K); border-color: transparent; }
.vlag.V { background: color-mix(in srgb, var(--rol-V) 16%, transparent); color: var(--rol-V); border-color: transparent; }
.vlag.M { background: color-mix(in srgb, var(--rol-M) 16%, transparent); color: var(--rol-M); border-color: transparent; }
.vlag.A { background: color-mix(in srgb, var(--rol-A) 16%, transparent); color: var(--rol-A); border-color: transparent; }

/* ------------------------------------------------------------------ spelerlijst */
.spelerrij {
  display: flex; align-items: center; gap: 11px; padding: 10px 4px;
  border-bottom: 1px solid var(--rand); cursor: pointer;
}
.spelerrij:last-child { border-bottom: 0; }
.bal {
  width: 38px; height: 38px; border-radius: 11px; flex: none; display: grid; place-items: center;
  background: var(--vlak-2); border: 1px solid var(--rand); font-weight: 700; font-size: .85rem;
}
.spelerrij .naam { flex: 1; min-width: 0; font-weight: 600; }
.spelerrij .naam small { display: block; font-weight: 500; font-size: .76rem; color: var(--zacht);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.saldo { font-variant-numeric: tabular-nums; font-size: .8rem; font-weight: 650; color: var(--zacht); }
.saldo.plus { color: var(--rol-V); }
.saldo.min { color: var(--waarschuwing); }

/* ------------------------------------------------------------------ veld (svg) */
.veld { width: 100%; display: block; border-radius: var(--r-s); overflow: hidden; }
.veld .gras-a { fill: var(--veld-1); }
.veld .gras-b { fill: var(--veld-2); }
.veld .lijn { fill: none; stroke: rgba(255,255,255,.5); stroke-width: .7; }
.veld .naam { font-size: 4.4px; font-weight: 650; fill: #fff; text-anchor: middle;
  paint-order: stroke; stroke: rgba(0,0,0,.45); stroke-width: .9px; }
.veld .nr { font-size: 6.2px; font-weight: 800; text-anchor: middle; dominant-baseline: central; fill: #fff; }
.veld .pion { stroke: rgba(255,255,255,.85); stroke-width: .8; }
.veld .pos { font-size: 3.4px; fill: rgba(255,255,255,.75); text-anchor: middle; font-weight: 600; }

/* ------------------------------------------------------------------ schema-tabel */
.schema-wrap { overflow-x: auto; margin: 0 -14px; padding: 0 14px; }
table.schema { border-collapse: separate; border-spacing: 0; width: 100%; font-size: .82rem; }
table.schema th, table.schema td { padding: 0; }
table.schema thead th { font-size: .7rem; font-weight: 700; color: var(--zacht); text-align: center;
  padding-bottom: 6px; white-space: nowrap; }
table.schema thead th.sp { text-align: left; padding-left: 2px; }
table.schema tbody td { padding: 2px; }
table.schema td.sp { text-align: left; font-weight: 600; white-space: nowrap; padding-right: 8px;
  max-width: 96px; overflow: hidden; text-overflow: ellipsis; }
table.schema td.tot { text-align: right; font-variant-numeric: tabular-nums; color: var(--zacht);
  font-weight: 650; padding-left: 6px; white-space: nowrap; }
.cel {
  display: block; width: 100%; min-height: 40px; border-radius: 9px; border: 0; cursor: pointer;
  font-weight: 750; font-size: .78rem; color: #fff; letter-spacing: .01em;
}
.cel.K { background: var(--rol-K); } .cel.V { background: var(--rol-V); }
.cel.M { background: var(--rol-M); } .cel.A { background: var(--rol-A); }
.cel.bank { background: var(--vlak-2); color: var(--bank); border: 1px dashed var(--rand); font-weight: 600; }
.cel.weg { background: transparent; color: var(--rand); border: 1px dashed var(--rand); }
.cel.vast { box-shadow: inset 0 0 0 2px var(--tekst); }

/* ------------------------------------------------------------------ wisselkaart */
.wissel { border: 1px solid var(--rand); border-radius: var(--r-s); padding: 11px; margin-bottom: 8px;
  background: var(--vlak-2); }
.wissel .wanneer { font-size: .74rem; font-weight: 700; color: var(--zacht); text-transform: uppercase;
  letter-spacing: .05em; margin-bottom: 7px; }
.beweging { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: .9rem; }
.beweging .pijl { width: 22px; text-align: center; font-weight: 800; flex: none; }
.beweging.uit .pijl { color: var(--alarm); }
.beweging.erin .pijl { color: var(--accent); }
.beweging.schuif .pijl { color: var(--rol-M); }
.beweging b { font-weight: 700; }
.beweging span { color: var(--zacht); font-size: .82rem; }

/* ------------------------------------------------------------------ waarschuwingen */
.melding { display: flex; gap: 9px; padding: 10px 12px; border-radius: var(--r-s); margin-bottom: 7px;
  font-size: .86rem; line-height: 1.4; }
.melding .ico { flex: none; font-weight: 800; }
.melding.hoog { background: var(--alarm-zacht); color: var(--alarm); }
.melding.midden { background: var(--waarschuwing-zacht); color: var(--waarschuwing); }
.melding.info { background: var(--vlak-2); color: var(--zacht); }

/* ------------------------------------------------------------------ live */
.klok-kaart { text-align: center; padding: 18px 14px 14px; }
.klok { font-size: 3.6rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.035em;
  line-height: 1; margin: 2px 0 4px; }
.klok.pauze { color: var(--zacht); }
.kwartlabel { font-size: .8rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--zacht); }
.balk { height: 9px; border-radius: 99px; background: var(--vlak-2); overflow: hidden; margin: 12px 0 8px;
  border: 1px solid var(--rand); }
.balk > i { display: block; height: 100%; background: var(--accent); transition: width .3s linear; }
.balk.bijna > i { background: var(--waarschuwing); }
.balk.nu > i { background: var(--alarm); }
.tot-wissel { font-size: .88rem; color: var(--zacht); font-weight: 600; }
.tot-wissel b { color: var(--tekst); font-variant-numeric: tabular-nums; }

.scorekaart { padding: 12px 14px 14px; }
.stand { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 10px; }
.stand > div { display: flex; flex-direction: column; align-items: center; min-width: 64px; }

.nav {

.nav button {

.nav button[aria-current="page"] { color: var(--accent); background: var(--accent-zacht); }

.nav button .punt { position: absolute; margin: -2px 0 0 18px; width: 7px; height: 7px;

/* ------------------------------------------------------------------ sheet */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(8, 18, 14, .45);

.strook:last-child { border-bottom: 0; }

  geenKeeperStraf: 500,  // strafpunten als er geen keeper op het veld staat
  vormAccent: 0,         // 0 = iedereen even veel, 1 = sterkte telt maximaal mee
  saldoGewicht: 0.6,     // hoe sterk het seizoenssaldo meeweegt (0 = niet)
  herstarts: 6,
  maxRondes: 12,
  seed: 20240101,
};

// ---------------------------------------------------------------- hulpjes

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let blokTeller = 0;
function blokId() {
  blokTeller += 1;
  return `b${Date.now().toString(36)}${blokTeller.toString(36)}`;
}

const klem = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

/** Beschikbaarheidsvenster van een speler, met defaults. */
function venster(match, spelerId) {
  const v = (match.beschikbaar || {})[spelerId] || {};
  return { vanaf: v.vanaf ?? 0, tot: v.tot ?? Infinity };
}

/** Staat deze speler dit blok tot je beschikking? Getoetst op het midden van het blok. */
function beschikbaarIn(match, spelerId, blok) {
  const v = venster(match, spelerId);
  const midden = (blok.vanSec + blok.totSec) / 2;
  return v.vanaf <= midden && v.tot >= midden;
}

function totaleSpeeltijd(match) {
  return match.periodes * match.periodeMin * 60;
}

// ---------------------------------------------------------- blokken bouwen

/** Verse blokindeling op basis van kwarten en wisselmomenten per kwart. */
function maakBlokken(match) {
  const perBlok = Math.round((match.periodeMin * 60) / match.blokkenPerPeriode);
  const blokken = [];
  let t = 0;
  for (let p = 0; p < match.periodes; p++) {
    for (let d = 0; d < match.blokkenPerPeriode; d++) {
      const laatste = d === match.blokkenPerPeriode - 1;
      const tot = laatste ? (p + 1) * match.periodeMin * 60 : t + perBlok;
      blokken.push({
        id: blokId(), periode: p, deel: d,
        vanSec: t, totSec: tot,
        vast: false, opstelling: {}, bank: [],
      });
      t = tot;
    }
  }
  return blokken;
}

/**
 * Splitst het blok waar tSec middenin valt in twee stukken. Het eerste stuk
 * houdt de opstelling (dat is immers wat er gespeeld is), het tweede stuk is
 * vrij om opnieuw in te vullen. Dit is de kern van het herplannen: een speler
 * die op minuut 23 uitvalt maakt van kwart 2 twee deelblokken.
 */
function splitsOp(blokken, tSec, minStuk = 30) {
  const uit = [];
  for (const b of blokken) {
    if (tSec > b.vanSec + minStuk && tSec < b.totSec - minStuk) {
      uit.push({ ...b, totSec: tSec, opstelling: { ...b.opstelling }, bank: [...b.bank] });
      uit.push({ ...b, id: blokId(), deel: b.deel, vanSec: tSec, vast: false, opstelling: { ...b.opstelling }, bank: [...b.bank] });
    } else {
      uit.push({ ...b, opstelling: { ...b.opstelling }, bank: [...b.bank] });
    }
  }
  return uit;
}

/**
 * Alles wat voorbij is wordt historie: vast, niet meer herplanbaar.
 * De marge zorgt dat een blok dat toch al bijna afgelopen was volledig als
 * gespeeld telt, in plaats van met terugwerkende kracht te worden herschreven.
 */
function vergrendelTot(blokken, tSec, marge = 30) {
  return blokken.map((b) => (b.totSec <= tSec + marge ? { ...b, vast: true } : b));
}

/**
 * Verschuift de grens tussen blok i en i+1 naar de werkelijke wisseltijd.
 * Je wisselt nooit precies op de seconde; dit houdt de boekhouding eerlijk
 * zonder de kwartgrenzen te verschuiven.
 */
function verlegGrens(blokken, index, tSec) {
  if (index < 0 || index >= blokken.length - 1) return blokken;
  const onder = blokken[index].vanSec + 10;
  const boven = blokken[index + 1].totSec - 10;
  const t = klem(tSec, onder, boven);
  return blokken.map((b, i) => {
    if (i === index) return { ...b, totSec: t };
    if (i === index + 1) return { ...b, vanSec: t };
    return b;
  });
}

// ------------------------------------------------------- laag 1: wie speelt

function bepaalDoelen(match, spelers, blokken, capaciteit, opties) {
  const totaalVeldSec = blokken.reduce((s, b, i) => s + (b.totSec - b.vanSec) * capaciteit[i], 0);

  const sterktes = spelers.map((p) => p.sterkte ?? 3);
  const gemSterkte = sterktes.reduce((a, b) => a + b, 0) / (sterktes.length || 1);

  const gewichten = spelers.map((p) => {
    let g = blokken.reduce((s, b) => s + (beschikbaarIn(match, p.id, b) ? b.totSec - b.vanSec : 0), 0);
    // Accent op basisspelers: alleen als de coach de schuif bewust opendraait.
    g *= 1 + opties.vormAccent * (((p.sterkte ?? 3) - gemSterkte) / 4);
    return Math.max(0, g);
  });
  const somGewicht = gewichten.reduce((a, b) => a + b, 0) || 1;

  const doelen = new Map();
  spelers.forEach((p, i) => doelen.set(p.id, (totaalVeldSec * gewichten[i]) / somGewicht));

  // Seizoenssaldo als zacht duwtje: wie voorstaat speelt vandaag iets minder.
  // Begrensd op een half blok, zodat het nooit een hele wedstrijd scheeftrekt.
  if (opties.saldoGewicht > 0 && blokken.length) {
    const blokDuur = (blokken[0].totSec - blokken[0].vanSec) || 600;
    const maxCorr = blokDuur / 2;
    const ruw = spelers.map((p) => klem(-(p.saldoSec || 0) * opties.saldoGewicht, -maxCorr, maxCorr));
    const gem = ruw.reduce((a, b) => a + b, 0) / (ruw.length || 1);
    spelers.forEach((p, i) => doelen.set(p.id, doelen.get(p.id) + (ruw[i] - gem)));
  }
  return { doelen, totaalVeldSec };
}

function kostenVan(aanwezig, ctx) {
  const { blokken, spelers, doelen, opties, beschikbaarMatrix, heeftKeepers, capaciteit } = ctx;
  let c = 0;

  // 1. eerlijke speeltijd
  const gespeeld = new Map(spelers.map((p) => [p.id, 0]));
  for (let i = 0; i < blokken.length; i++) {
    const duur = blokken[i].totSec - blokken[i].vanSec;
    for (const id of aanwezig[i]) if (gespeeld.has(id)) gespeeld.set(id, gespeeld.get(id) + duur);
  }
  for (const p of spelers) {
    const dev = (gespeeld.get(p.id) - doelen.get(p.id)) / 60;
    c += opties.eerlijkheid * dev * dev;
  }

  // 2. niet twee blokken achter elkaar op de bank
  for (let s = 0; s < spelers.length; s++) {
    let reeks = 0;
    for (let i = 0; i < blokken.length; i++) {
      if (!beschikbaarMatrix[s][i]) { reeks = 0; continue; }
      if (aanwezig[i].has(spelers[s].id)) reeks = 0;
      else { reeks += 1; if (reeks >= 2) c += opties.rustGewicht; }
    }
  }

  // 3. er hoort een keeper op het veld te staan
  if (heeftKeepers) {
    for (let i = 0; i < blokken.length; i++) {
      if (capaciteit[i] <= 0) continue;
      let ok = false;
      for (const id of aanwezig[i]) {
        const p = spelers.find((q) => q.id === id);
        if (p && p.keeper) { ok = true; break; }
      }
      if (!ok) c += opties.geenKeeperStraf;
    }
  }
  return c;
}

function losWieOp(ctx, rng) {
  const { blokken, spelers, doelen, capaciteit, openIdx, gepind, beschikbaarMatrix } = ctx;
  const idx = new Map(spelers.map((p, i) => [p.id, i]));

  const startAanwezig = () => ctx.basisAanwezig.map((s) => new Set(s));

  const kandidatenVoor = (i) =>
    spelers.filter((p, s) => beschikbaarMatrix[s][i] && !gepind[i].has(p.id));

  // --- greedy startoplossing: wie het verst achterloopt komt erin
  const greedy = () => {
    const aanwezig = startAanwezig();
    const gespeeld = new Map(spelers.map((p) => [p.id, 0]));
    for (let i = 0; i < blokken.length; i++) {
      const duur = blokken[i].totSec - blokken[i].vanSec;
      if (!openIdx.includes(i)) {
        for (const id of aanwezig[i]) if (gespeeld.has(id)) gespeeld.set(id, gespeeld.get(id) + duur);
        continue;
      }
      const nodig = capaciteit[i] - aanwezig[i].size;
      const kand = kandidatenVoor(i)
        .filter((p) => !aanwezig[i].has(p.id))
        .map((p) => {
          const tekort = doelen.get(p.id) - gespeeld.get(p.id);
          const zatVorige = i > 0 && !aanwezig[i - 1].has(p.id) && beschikbaarMatrix[idx.get(p.id)][i - 1];
          return { p, score: tekort + (zatVorige ? duur * 0.75 : 0) + rng() * 30 };
        })
        .sort((a, b) => b.score - a.score);
      for (let k = 0; k < nodig && k < kand.length; k++) aanwezig[i].add(kand[k].p.id);
      for (const id of aanwezig[i]) if (gespeeld.has(id)) gespeeld.set(id, gespeeld.get(id) + duur);
    }
    return aanwezig;
  };

  const willekeurig = () => {
    const aanwezig = startAanwezig();
    for (const i of openIdx) {
      const kand = kandidatenVoor(i).filter((p) => !aanwezig[i].has(p.id));
      for (let k = kand.length - 1; k > 0; k--) {
        const j = Math.floor(rng() * (k + 1));
        [kand[k], kand[j]] = [kand[j], kand[k]];
      }
      const nodig = capaciteit[i] - aanwezig[i].size;
      for (let k = 0; k < nodig && k < kand.length; k++) aanwezig[i].add(kand[k].id);
    }
    return aanwezig;
  };

  // --- local search: ruil een veldspeler tegen een bankspeler zolang dat helpt
  const verbeter = (aanwezig) => {
    let beste = kostenVan(aanwezig, ctx);
    for (let ronde = 0; ronde < ctx.opties.maxRondes; ronde++) {
      let verbeterd = false;
      for (const i of openIdx) {
        const veld = [...aanwezig[i]].filter((id) => !gepind[i].has(id));
        const bank = kandidatenVoor(i).filter((p) => !aanwezig[i].has(p.id)).map((p) => p.id);
        for (const a of veld) {
          for (const b of bank) {
            if (!aanwezig[i].has(a) || aanwezig[i].has(b)) continue;
            aanwezig[i].delete(a); aanwezig[i].add(b);
            const k = kostenVan(aanwezig, ctx);
            if (k < beste - 1e-9) { beste = k; verbeterd = true; }
            else { aanwezig[i].delete(b); aanwezig[i].add(a); }
          }
        }
      }
      if (!verbeterd) break;
    }
    return beste;
  };

  let besteOpl = greedy();
  let besteKosten = verbeter(besteOpl);
  for (let r = 0; r < ctx.opties.herstarts; r++) {
    const kand = willekeurig();
    const k = verbeter(kand);
    if (k < besteKosten - 1e-9) { besteKosten = k; besteOpl = kand; }
  }
  return { aanwezig: besteOpl, kosten: besteKosten };
}

// ------------------------------------------------- laag 2: waar staat iedereen

function kiesKeepers(blokken, aanwezig, spelers, formatie, rng) {
  const heeftKeeperSlot = formatie.slots.some((s) => s.role === 'K');
  if (!heeftKeeperSlot) return { keeperPer: blokken.map(() => null), zonderKeeper: [] };

  const opId = new Map(spelers.map((p) => [p.id, p]));
  const telling = new Map();
  const keeperPer = [];
  const zonderKeeper = [];
  let vorige = null;

  for (let i = 0; i < blokken.length; i++) {
    const b = blokken[i];
    if (b.vast) {
      const keeperSlot = formatie.slots.find((s) => s.role === 'K');
      const id = b.opstelling[keeperSlot.id] || null;
      if (id) telling.set(id, (telling.get(id) || 0) + 1);
      keeperPer.push(id);
      vorige = id ? { id, periode: b.periode } : null;
      continue;
    }
    const opVeld = [...aanwezig[i]].map((id) => opId.get(id)).filter(Boolean);
    let kandidaten = opVeld.filter((p) => p.keeper);
    if (!kandidaten.length) { kandidaten = opVeld; if (opVeld.length) zonderKeeper.push(i); }
    if (!kandidaten.length) { keeperPer.push(null); continue; }

    const gescoord = kandidaten.map((p) => {
      let s = (telling.get(p.id) || 0) * 100;
      // binnen hetzelfde kwart niet van keeper wisselen
      if (vorige && vorige.id === p.id && vorige.periode === b.periode) s -= 1000;
      // en liever niet twee kwarten achter elkaar in het doel
      else if (vorige && vorige.id === p.id) s += 60;
      return { p, s: s + rng() * 5 };
    }).sort((a, b2) => a.s - b2.s);

    const keeper = gescoord[0].p;
    telling.set(keeper.id, (telling.get(keeper.id) || 0) + 1);
    keeperPer.push(keeper.id);
    vorige = { id: keeper.id, periode: b.periode };
  }
  return { keeperPer, zonderKeeper };
}

function wijsPositiesToe(blokken, aanwezig, spelers, formatie, keeperPer, gepind) {
  const opId = new Map(spelers.map((p) => [p.id, p]));
  const slotTelling = new Map(); // "spelerId|slotId" -> hoe vaak al
  let vorigeOpstelling = null;
  const uit = [];

  for (let i = 0; i < blokken.length; i++) {
    const b = blokken[i];
    if (b.vast) {
      for (const [slotId, pid] of Object.entries(b.opstelling)) {
        const k = `${pid}|${slotId}`;
        slotTelling.set(k, (slotTelling.get(k) || 0) + 1);
      }
      uit.push({ ...b });
      vorigeOpstelling = b.opstelling;
      continue;
    }

    const opVeld = [...aanwezig[i]];
    const slots = slotsForCount(formatie, opVeld.length);
    const pin = gepind[i];

    // Waar stond iedereen net? Zonder die referentie herverdeelt het algoritme
    // bij elke herberekening het hele elftal - dat is langs de lijn onwerkbaar.
    // Eerst het vorige blok (dat staat nu echt op het veld), anders wat er
    // voor dit blok al gepland stond.
    const eigenOud = Object.keys(b.opstelling).length ? b.opstelling : null;
    const referentie = vorigeOpstelling || eigenOud;

    // Gepinde spelers krijgen hun slot; de rest wordt exact toegewezen.
    const vastSlot = new Map();
    for (const [slotId, pid] of pin.entries()) if (opVeld.includes(pid)) vastSlot.set(pid, slotId);

    const vrijeSpelers = opVeld.filter((id) => !vastSlot.has(id));
    const bezet = new Set(vastSlot.values());
    const vrijeSlots = slots.filter((s) => !bezet.has(s.id));

    const n = Math.min(vrijeSpelers.length, vrijeSlots.length);
    const opstelling = {};
    for (const [pid, slotId] of vastSlot.entries()) opstelling[slotId] = pid;

    if (n > 0) {
      const matrix = vrijeSpelers.slice(0, n).map((pid) => {
        const p = opId.get(pid) || { posities: [] };
        return vrijeSlots.map((slot) => {
          let c = 0;
          if (slot.role === 'K') c += keeperPer[i] === pid ? 0 : 5000;
          else if (keeperPer[i] === pid) c += 5000;
          else {
            const voorkeur = p.posities || [];
            if (voorkeur.length) c += voorkeur.includes(slot.role) ? 0 : 18;
          }
          const vorigSlotId = referentie && Object.keys(referentie).find((sid) => referentie[sid] === pid);
          if (vorigSlotId === slot.id) {
            c -= 14; // blijven staan is bijna altijd beter dan een mooiere positie
          } else if (vorigSlotId) {
            const vorigSlot = formatie.slots.find((s) => s.id === vorigSlotId);
            if (vorigSlot && vorigSlot.role === slot.role) c -= 5;
          } else if (eigenOud && referentie !== eigenOud) {
            // Invaller: zet hem op de plek die voor dit blok al voor hem klaarlag.
            const gepland = Object.keys(eigenOud).find((sid) => eigenOud[sid] === pid);
            if (gepland === slot.id) c -= 6;
          }
          c += (slotTelling.get(`${pid}|${slot.id}`) || 0) * 1.5;
          return c;
        });
      });
      const toewijzing = hungarian(matrix);
      toewijzing.forEach((kolom, rij) => {
        if (kolom >= 0) opstelling[vrijeSlots[kolom].id] = vrijeSpelers[rij];
      });
    }

    for (const [slotId, pid] of Object.entries(opstelling)) {
      const k = `${pid}|${slotId}`;
      slotTelling.set(k, (slotTelling.get(k) || 0) + 1);
    }

    const opVeldSet = new Set(Object.values(opstelling));
    const bank = spelers.filter((p) => !opVeldSet.has(p.id)).map((p) => p.id);
    uit.push({ ...b, opstelling, bank });
    vorigeOpstelling = opstelling;
  }
  return uit;
}

// ------------------------------------------------------------- hoofdingang

/**
 * Bouwt (of herbouwt) het wisselschema.
 * Vaste blokken blijven onaangeroerd - dat is gespeelde historie.
 *
 * @param {object} match
 * @param {Array} alleSpelers  de complete selectie van het team
 * @returns {{blokken, waarschuwingen, statistieken, wissels, kosten}}
 */
function planWedstrijd(match, alleSpelers, opties = {}) {
  const o = { ...STANDAARD_OPTIES, ...(match.opties || {}), ...opties };
  const formatie = getFormation(match.formationId);
  const spelers = (match.selectie || [])
    .map((id) => alleSpelers.find((p) => p.id === id))
    .filter(Boolean);

  let blokken = (match.blokken && match.blokken.length ? match.blokken : maakBlokken(match))
    .map((b) => ({ ...b, opstelling: { ...b.opstelling }, bank: [...(b.bank || [])] }));

  if (!spelers.length) {
    return { blokken, waarschuwingen: [{ ernst: 'info', tekst: 'Nog geen spelers geselecteerd voor deze wedstrijd.' }], statistieken: [], wissels: [], kosten: 0 };
  }

  const beschikbaarMatrix = spelers.map((p) => blokken.map((b) => beschikbaarIn(match, p.id, b)));
  const capaciteit = blokken.map((b, i) => {
    if (b.vast) return Object.keys(b.opstelling).length;
    const aantal = beschikbaarMatrix.reduce((s, rij) => s + (rij[i] ? 1 : 0), 0);
    return Math.min(formatie.slots.length, aantal);
  });

  const pinsPerBlok = blokken.map((b) => {
    const m = new Map();
    const pin = (match.pins || {})[b.id] || {};
    for (const [slotId, pid] of Object.entries(pin)) if (spelers.some((p) => p.id === pid)) m.set(slotId, pid);
    return m;
  });
  const gepind = pinsPerBlok.map((m) => new Set(m.values()));

  const basisAanwezig = blokken.map((b, i) => {
    if (b.vast) return new Set(Object.values(b.opstelling));
    return new Set(gepind[i]);
  });
  const openIdx = blokken.map((b, i) => (b.vast ? -1 : i)).filter((i) => i >= 0);

  const { doelen } = bepaalDoelen(match, spelers, blokken, capaciteit, o);
  const heeftKeepers = spelers.some((p) => p.keeper) && formatie.slots.some((s) => s.role === 'K');

  const ctx = { blokken, spelers, doelen, opties: o, beschikbaarMatrix, capaciteit, openIdx, gepind, basisAanwezig, heeftKeepers };
  const rng = mulberry32(o.seed);
  const { aanwezig, kosten } = losWieOp(ctx, rng);

  const { keeperPer, zonderKeeper } = kiesKeepers(blokken, aanwezig, spelers, formatie, rng);
  blokken = wijsPositiesToe(blokken, aanwezig, spelers, formatie, keeperPer, pinsPerBlok);

  const stats = statistieken(blokken, spelers, formatie);
  const waarschuwingen = maakWaarschuwingen({ match, blokken, spelers, formatie, stats, capaciteit, zonderKeeper, beschikbaarMatrix, doelen });

  return { blokken, waarschuwingen, statistieken: stats, wissels: wisselLijst(blokken, spelers, formatie), kosten };
}

// ------------------------------------------------------------- afgeleide info

function statistieken(blokken, spelers, formatie) {
  const keeperSlots = new Set(formatie.slots.filter((s) => s.role === 'K').map((s) => s.id));
  const totaal = blokken.reduce((s, b) => s + (b.totSec - b.vanSec), 0);

  return spelers.map((p) => {
    let speelSec = 0, keeperSec = 0, blokkenGespeeld = 0, bankBlokken = 0, langsteBank = 0, reeks = 0;
    const perRol = { K: 0, V: 0, M: 0, A: 0 };
    for (const b of blokken) {
      const duur = b.totSec - b.vanSec;
      const slotId = Object.keys(b.opstelling).find((sid) => b.opstelling[sid] === p.id);
      if (slotId) {
        speelSec += duur; blokkenGespeeld += 1; reeks = 0;
        if (keeperSlots.has(slotId)) keeperSec += duur;
        const slot = formatie.slots.find((s) => s.id === slotId);
        if (slot) perRol[slot.role] += duur;
      } else {
        bankBlokken += 1; reeks += 1; langsteBank = Math.max(langsteBank, reeks);
      }
    }
    return {
      spelerId: p.id, naam: p.naam,
      speelSec, bankSec: totaal - speelSec, keeperSec,
      blokken: blokkenGespeeld, bankBlokken, langsteBankReeks: langsteBank, perRol,
    };
  }).sort((a, b) => b.speelSec - a.speelSec);
}

/** Per wisselmoment: wie eruit, wie erin, en wie er van positie verandert. */
function wisselLijst(blokken, spelers, formatie) {
  const naam = new Map(spelers.map((p) => [p.id, p.naam]));
  const slotVan = (opst, pid) => Object.keys(opst).find((sid) => opst[sid] === pid);
  const label = (sid) => (formatie.slots.find((s) => s.id === sid) || {}).label || sid;

  const uit = [];
  for (let i = 1; i < blokken.length; i++) {
    const vorig = blokken[i - 1], nu = blokken[i];
    const vorigeSpelers = new Set(Object.values(vorig.opstelling));
    const nieuweSpelers = new Set(Object.values(nu.opstelling));

// zodanig dat de totale "kosten" minimaal zijn.

      used[j0] = true;
      const i0 = p[j0];

      let j1 = -1;
      for (let j = 1; j <= m; j++) {
        if (used[j]) continue;

      j0 = j1;

// De stand bijhouden, en per speler tellen wat er gebeurde terwijl hij op
// het veld stond. Zonder DOM, zodat het ook in Node getest kan worden.
//
// Een doelpunt: { id, wie: 'wij' | 'zij', sec, opVeld: [spelerId, ...] }.
// `opVeld` is een momentopname: wie er stond toen de bal erin ging. Dat is
// genoeg voor de vraag langs de lijn: "met welke opstelling scoren we, en
// wanneer krijgen we er een tegen?"

function stand(doelpunten = []) {
  let wij = 0, zij = 0;
  for (const d of doelpunten) { if (d.wie === 'wij') wij++; else if (d.wie === 'zij') zij++; }
  return { wij, zij };
}

/** Per speler: doelpunten voor en tegen terwijl hij in het veld stond. */
function plusMin(doelpunten = []) {
  const uit = {};
  for (const d of doelpunten) {
    for (const id of d.opVeld || []) {
      const r = (uit[id] ||= { voor: 0, tegen: 0, saldo: 0 });
      if (d.wie === 'wij') r.voor++; else r.tegen++;
      r.saldo = r.voor - r.tegen;
    }
  }
  return uit;
}

/** Tussenstand na elk doelpunt, in volgorde van de klok. */
function verloop(doelpunten = []) {
  let wij = 0, zij = 0;
  return [...doelpunten].sort((a, b) => a.sec - b.sec).map((d) => {
    if (d.wie === 'wij') wij++; else zij++;
    return { ...d, wij, zij };
  });
}

/** Minuut zoals op het wedstrijdformulier: een goal na 0:30 is in de 1e minuut. */
const goalMinuut = (sec) => Math.max(1, Math.ceil(sec / 60));

return { stand, plusMin, verloop, goalMinuut };
};

}

/** Wat je de nieuwe trainer stuurt: adres, gebruikersnaam en wachtwoord in één berichtje. */

  const tekst = [
    nieuw ? `Hoi ${g.naam.split(' ')[0]}, je hebt een account voor Het Wisselschema.` : `Hoi ${g.naam.split(' ')[0]}, je hebt een nieuw wachtwoord voor Het Wisselschema.`,

    `Adres: ${adres}`,
    `Gebruikersnaam: ${g.gebruikersnaam}`,
    `Wachtwoord: ${wachtwoord}`,

    c.appendChild(vak);
    c.appendChild(h('div', { class: 'knoprij', style: { marginTop: '10px' } },
      navigator.share ? h('button', { class: 'knop', onclick: async () => {
        try { await navigator.share({ text: vak.value }); } catch (e) { /* afgebroken */ }
      } }, 'Versturen') : null,
      h('button', { class: 'knop primair', style: { flex: '2' }, onclick: async () => {
        melding(await kopieer(vak.value) ? 'Gekopieerd' : 'Kopiëren lukte niet - selecteer de tekst zelf');
      } }, 'Kopiëren'),

}
