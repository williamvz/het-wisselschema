name: Het Wisselschema
version: "1.0.0"
slug: wisselschema
description: Wisselschema-assistent voor jeugdvoetbal - maakt het schema, bewaakt de wissels en herplant bij uitval.
url: https://github.com/williamvz/het-wisselschema
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
startup: application
boot: auto
init: false

# Via ingress verschijnt de app in de zijbalk van Home Assistant, met de
# inlog van Home Assistant ervoor. Dat is de aanbevolen route.
ingress: true
ingress_port: 8099
panel_icon: mdi:soccer
panel_title: Wisselschema
panel_admin: false

# Standaard uit. Zet je hier een poort, dan is de app ook rechtstreeks
# bereikbaar - handig voor een eigen domein via een reverse proxy, maar dan
# zit er geen inlog meer voor. Zie de README.
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Rechtstreekse toegang, zonder inlog van Home Assistant

options:
  allow_cors: true
schema:
  allow_cors: bool
